name: Deploy background jobs

# Deploys jobs/ (Trigger.dev tasks) to production.
# Requires repository secrets: TRIGGER_ACCESS_TOKEN and TRIGGER_PROJECT_REF.
# Worker secrets (ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) live in
# Trigger.dev → Environment Variables, never in GitHub or the repository.

# Manual only while jobs run inline on Vercel (Plan B, 2026-11-27): Trigger.dev refused
# deployments for the organisation. Re-enable the push trigger when switching back.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jobs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets are configured
        env:
          TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          REF: ${{ secrets.TRIGGER_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::TRIGGER_ACCESS_TOKEN or TRIGGER_PROJECT_REF is not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: env.skip != 'true'
      - uses: actions/setup-node@v4
        if: env.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.skip != 'true'
      - name: Typecheck jobs
        if: env.skip != 'true'
        run: pnpm --filter @contentos/jobs typecheck
      - name: Deploy to Trigger.dev
        if: env.skip != 'true'
        working-directory: jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ secrets.TRIGGER_PROJECT_REF }}
        run: pnpm exec trigger deploy
